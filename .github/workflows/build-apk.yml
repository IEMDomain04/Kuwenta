name: Build Kuwenta APK
run-name: Kuwenta APK (${{ inputs.build_ref }})

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch or commit to build
        required: true
        default: staging
        type: string

permissions:
  contents: read

concurrency:
  group: kuwenta-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "1"
      EAS_NO_TELEMETRY: "1"
    steps:
      - name: Check Expo authentication is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in repository Settings > Secrets and variables > Actions. Create it at https://expo.dev/accounts/iemdomain04/settings/access-tokens."
            exit 1
          fi

      - name: Check out selected code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.build_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            app.json

      - name: Configure Gradle for the shared runner
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.console=plain
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check TypeScript
        run: npx --no-install tsc --noEmit

      - name: Test finance behavior
        run: npm run test:finance

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.1.12297006' 'cmake;3.22.1'

      # --local compiles on this GitHub runner, not on EAS cloud builders.
      # preview preserves the existing signing key and increments the EAS version code.
      - name: Build signed APK on GitHub
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/kuwenta-build
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          report_resources() {
            echo "::group::Runner resources (this does not indicate compiler progress)"
            date -u
            free -h
            df -h "$RUNNER_TEMP"
            ps -eo pid,ppid,comm,pcpu,pmem,rss --sort=-rss | sed -n '1,12p'
            if [ -r /sys/fs/cgroup/memory.events ]; then
              cat /sys/fs/cgroup/memory.events
            fi
            echo "::endgroup::"
          }
          report_resources
          (
            while sleep 60; do report_resources; done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          set +e
          timeout --signal=TERM --kill-after=60s 90m \
            npx --yes eas-cli@25.2.0 build --platform android --profile preview \
              --local --non-interactive --output "$RUNNER_TEMP/kuwenta.apk"
          build_status=$?
          set -e
          if [ "$build_status" -eq 124 ] || [ "$build_status" -eq 137 ]; then
            echo "::error::APK build exceeded its time limit or was killed. Check the compiler output and runner memory/disk reports above before retrying."
          fi
          exit "$build_status"

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kuwenta-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/kuwenta.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Show download instructions
        run: |
          echo '### Kuwenta APK is ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the kuwenta-apk artifact below and extract kuwenta.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Install it as an update to keep your existing records.' >> "$GITHUB_STEP_SUMMARY"
